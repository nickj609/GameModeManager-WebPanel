# One pull request a month per kind (NuGet packages, the Docker image, GitHub Actions), each with all its updates.
# .NET stays on its major version (10): moving to the next one is a deliberate change, not a Dependabot bump.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      nuget:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: [ "version-update:semver-major" ]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "dotnet/*"
        update-types: [ "version-update:semver-major" ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: [ "*" ]
